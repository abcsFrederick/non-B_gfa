name: Render README

on:
  push:
    branches:
      - Rpkg
  pull_request:
    branches:
      - Rpkg
    paths:
      - 'README.qmd'
      - 'R/**'
      - 'src/**'       # Trigger if C code changes
      - 'inst/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # This magic step automatically installs system libraries for C/C++ 
      # and Bioconductor dependencies found in your DESCRIPTION
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::knitr
            any::stringr
            any::gitr
          needs: website # Ensures it installs the package itself

      - name: Render README
        run: quarto render README.qmd

      - name: Commit and Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Auto-render README.qmd [skip ci]" || echo "No changes to commit"
          git push
